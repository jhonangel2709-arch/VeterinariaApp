<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Veterinaria App</title>


    <meta charset="UTF-8">

    <style>

        body {
            font-family: Arial;
            margin: 40px;
        }

        h1 {
            color: #2c7a7b;
        }

        form {
            width: 400px;
            margin-bottom: 40px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, select {
            width: 100%;
            padding: 8px;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            background-color: #2c7a7b;
            color: white;
            border: none;
        }

        table {
            width: 70%;
            border-collapse: collapse;
        }

        th {
            background-color: #2c7a7b;
            color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

    </style>

</head>


<body>


<h1>🐶🐱 Veterinaria App</h1>


<h2>Registrar Mascota</h2>


<form th:action="@{/registrar}" method="post">


    <label>Nombre:</label>
    <input type="text" name="nombre" required>


    <label>Edad:</label>
    <input type="number" name="edad" required>


    <label>Dueño:</label>
    <input type="text" name="dueno" required>


    <label>Tipo:</label>

    <select name="tipo">

        <option value="perro">Perro</option>

        <option value="gato">Gato</option>

    </select>


    <button type="submit">
        Registrar
    </button>


</form>



<h2>Lista de Mascotas</h2>


<table>

    <tr>

        <th>Nombre</th>
        <th>Edad</th>
        <th>Dueño</th>
        <th>Tipo</th>
        <th>Acción</th>


    </tr>


    <tr th:each="mascota : ${mascotas}">

        <td th:text="${mascota.nombre}"></td>

        <td th:text="${mascota.edad}"></td>

        <td th:text="${mascota.dueno}"></td>

        <td th:text="${mascota.tipo}"></td>


        <td>

            <a th:href="@{/vacunar/{id}(id=${mascota.id})}">
                💉 Vacunar
            </a>

        </td>

    </tr>


</table>

<p th:if="${mensaje}" th:text="${mensaje}"></p>

</body>

</html>
